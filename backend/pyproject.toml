[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "intellitrace"
version = "0.1.0"
description = "IntelliTrace – AI-powered financial crime detection backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "shap>=0.45",
    "anthropic>=0.28",
    "confluent-kafka>=2.3",
    "neo4j>=5.19",
    "cryptography>=42",
    "numpy>=1.26",
    "scipy>=1.12",
    "torch>=2.2",
    "networkx>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[kafka,postgresql]>=4.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["intellitrace"]
branch = true

[tool.coverage.report]
show_missing = true
