global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:29092']
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:7474']
