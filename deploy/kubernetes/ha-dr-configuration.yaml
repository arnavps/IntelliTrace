---
# ==========================================
# CAUSAL CLUSTERING: NEO4J ENTERPRISE
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-causal-cluster-config
  namespace: intellitrace
  annotations:
    architecture/topology: "Active-Active Multi-AZ"
data:
  neo4j.conf: |
    # Core Consensus Nodes (Raft Protocol)
    dbms.mode=CORE
    causal_clustering.discovery_type=DNS
    causal_clustering.initial_discovery_members=neo4j-core-0.neo4j.intellitrace.svc.cluster.local:5000,neo4j-core-1.neo4j.intellitrace.svc.cluster.local:5000,neo4j-core-2.neo4j.intellitrace.svc.cluster.local:5000
    causal_clustering.minimum_core_cluster_size_at_formation=3
    causal_clustering.minimum_core_cluster_size_at_runtime=3
    
    # Heap and Memory Performance Profiles
    dbms.memory.heap.initial_size=8G
    dbms.memory.heap.max_size=16G
    dbms.memory.pagecache.size=8G
    
    # Read Replica Configuration (Analytic Visual Queries)
    causal_clustering.read_replica_refresh_rate=500ms
    dbms.tx_log.rotation.retention_policy=2 days

---
# ==========================================
# DISTRIBUTED CONSENSUS: PATRONI POSTGRES
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-postgres-config
  namespace: intellitrace
  annotations:
    architecture/topology: "Primary-Replica Multi-AZ with etcd"
data:
  patroni.yml: |
    scope: intellitrace-postgres-cluster
    namespace: /db/
    name: postgresql-node-$(HOSTNAME)
    restapi:
      listen: 0.0.0.0:8008
      connect_address: $(POD_IP):8008
    etcd:
      host: etcd.intellitrace.svc.cluster.local:2379
    bootstrap:
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
        postgresql:
          use_pg_rewind: true
          use_slots: true
          parameters:
            wal_level: replica
            max_wal_senders: 10
            max_replication_slots: 10
            wal_keep_size: 1024
      initdb:
        - encoding: UTF8
        - data-checksums
    postgresql:
      listen: 0.0.0.0:5432
      connect_address: $(POD_IP):5432
      data_dir: /var/lib/postgresql/data
      pg_hba:
        - host replication replicator 0.0.0.0/0 md5
        - host all all 0.0.0.0/0 md5
      authentication:
        replication:
          username: replicator
          password: IntelliTraceReplicaSecure2026
        superuser:
          username: postgres
          password: IntelliTraceSuperSecure2026

---
# ==========================================
# DISASTER RECOVERY: HOURLY INCREMENTAL
# ==========================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-incremental-snapshot
  namespace: intellitrace
  annotations:
    compliance.intellitrace/dr-policy: "Banking-Compliant"
    compliance.intellitrace/rpo: "<5m via Kafka Offset Replay + WAL"
    compliance.intellitrace/rto: "<15m Automated Restore"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: pg-incremental-backup
            image: postgres:16
            command:
            - /bin/sh
            - -c
            - "pg_basebackup -h postgres.intellitrace.svc.cluster.local -U replicator -D /backup/incremental-$(date +%Y%m%d%H) -Fp -Xs -P && aws s3 sync /backup/ s3://intellitrace-dr-vault/postgres/incremental/ --sse AES256"
            env:
            - name: PGPASSWORD
              value: "IntelliTraceReplicaSecure2026"
            volumeMounts:
            - name: backup-vol
              mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: backup-vol
            emptyDir: {}

---
# ==========================================
# DISASTER RECOVERY: DAILY FULL ENCRYPTED
# ==========================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: neo4j-daily-full-snapshot
  namespace: intellitrace
  annotations:
    compliance.intellitrace/dr-policy: "Banking-Compliant"
    compliance.intellitrace/rpo: "<5m via Kafka Offset Replay"
    compliance.intellitrace/rto: "<15m Automated Restore"
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: neo4j-full-backup
            image: neo4j:5.12.0-enterprise
            command:
            - /bin/sh
            - -c
            - "neo4j-admin database backup --to-path=/backup/full-$(date +%Y%m%d) --include-metadata=all system intellitracedb && aws s3 sync /backup/ s3://intellitrace-dr-vault/neo4j/full/ --sse AES256"
            env:
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              value: "yes"
            volumeMounts:
            - name: backup-vol
              mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: backup-vol
            emptyDir: {}
